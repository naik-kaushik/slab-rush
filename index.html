<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Slab Rush! - A minimalist stacking game. How high can you go?" />
  <title>Slab Rush!</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="text/javascript">
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, "clarity", "script", "wc7xrrm6wb");
  </script>
</head>

<body>
  <div id="gw">
    <canvas id="c"></canvas>
    <div id="score">0</div>
    <div id="multiplier-container">
      <div id="multiplier-badge">2X</div>
      <div id="multiplier-time">5.0s</div>
    </div>
    <div id="coin-counter">
      <svg class="coin-icon" viewBox="0 0 24 24" fill="#ffd700" stroke="#b8860b" stroke-width="1.5">
        <circle cx="12" cy="12" r="9"></circle>
        <text x="50%" y="54%" text-anchor="middle" font-size="10" dy=".3em" fill="#b8860b" font-weight="bold">$</text>
      </svg>
      <span id="coin-val">0</span>
    </div>
    <div id="hint">
      <span class="mobile-hint">tap</span>
      <span class="desktop-hint">tap · click · space</span>
    </div>
    <div id="perfect">Perfect</div>
    <button id="sound-btn" aria-label="Toggle Sound"></button>
    <div id="overlay">
      <div id="card" class="glass">
        <img id="logo" src="assets/images/game_logo.png" alt="Slab Rush! Logo" />
        <h2>Slab Rush!</h2>
        <div class="tagline">How high can you go?</div>
        <button id="play-btn">Play</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>

</html>
